# Block for D:\server-projects\reverse-proxy\Caddyfile. The app listens on 127.0.0.1:8120 of the Docker host (see docker-compose.yml);
# Caddy reaches it through host.docker.internal, like chat.vibecods.xyz does.
zaliv.vibecods.xyz {
	encode zstd gzip
	header {
		-Server
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "same-origin"
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
	}
	reverse_proxy host.docker.internal:8120
}
